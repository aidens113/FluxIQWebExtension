<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FluxIQ</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>FluxIQ</h1>
          <p id="connectionLabel">Disconnected</p>
        </div>
        <span id="statusDot" class="dot"></span>
      </header>

      <nav class="tabs" aria-label="Extension sections">
        <button id="statusTab" class="tab active" type="button">Status</button>
        <button id="settingsTab" class="tab" type="button">Settings</button>
      </nav>

      <section id="statusPanel" class="panel active">
        <div class="actions">
          <button id="connectButton" type="button">Connect</button>
          <button id="disconnectButton" type="button">Disconnect</button>
        </div>

        <div class="actions">
          <button id="recordButton" type="button" class="primary">Record</button>
          <button id="stopButton" type="button">Stop</button>
        </div>

        <dl class="facts">
          <div><dt>Client</dt><dd id="clientId">-</dd></div>
          <div><dt>Session</dt><dd id="sessionId">-</dd></div>
          <div><dt>Tab</dt><dd id="activeTab">-</dd></div>
          <div><dt>Queued</dt><dd id="queueSize">0</dd></div>
        </dl>
      </section>

      <section id="settingsPanel" class="panel">
        <label class="field">
          <span>Gateway URL</span>
          <input id="gatewayUrl" type="url" spellcheck="false" autocomplete="off">
        </label>

        <section class="toggles">
          <label><input id="autoReconnect" type="checkbox"> Auto reconnect</label>
          <label><input id="captureMutations" type="checkbox"> DOM mutations</label>
          <label><input id="captureInputValues" type="checkbox"> Input values</label>
          <label><input id="captureSnapshots" type="checkbox"> Snapshots</label>
        </section>
      </section>

      <p id="errorText" class="error" hidden></p>

      <section id="pairingOverlay" class="pairing-overlay" aria-modal="true" role="dialog" aria-labelledby="pairingTitle" hidden>
        <div class="pairing-dialog">
          <h2 id="pairingTitle">Pair With FluxIQ</h2>
          <p>Compare this reference code with the approval modal in the FluxIQ web panel.</p>
          <div id="pairingReferenceCode" class="reference-code">------</div>
          <button id="overlayCancelButton" type="button">Cancel</button>
        </div>
      </section>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
